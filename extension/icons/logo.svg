<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- It's My Bib logo: teal rounded archive box with bookmark tab. Original design. -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0F766E"/>
  <!-- box body -->
  <path d="M28 52h72v44a8 8 0 0 1-8 8H36a8 8 0 0 1-8-8V52z" fill="#fff"/>
  <!-- box lid -->
  <path d="M24 38h80a6 6 0 0 1 6 6v8H18v-8a6 6 0 0 1 6-6z" fill="#CCFBF1"/>
  <rect x="52" y="30" width="24" height="10" rx="5" fill="#CCFBF1"/>
  <!-- bookmark -->
  <path d="M78 60h16v30l-8-6-8 6V60z" fill="#F59E0B"/>
  <!-- label lines -->
  <rect x="38" y="66" width="30" height="6" rx="3" fill="#0F766E" opacity="0.55"/>
  <rect x="38" y="78" width="22" height="6" rx="3" fill="#0F766E" opacity="0.35"/>
</svg>
